<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>People Prime | Outreach</title><meta name="description" content="People Prime America team outreach preview"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%232255e8'/%3E%3Ctext x='10' y='29' font-size='27' fill='white'%3EP%3C/text%3E%3C/svg%3E"><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172340;font:16px/1.5 system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}aside{position:fixed;inset:0 auto 0 0;width:236px;background:#102044;color:#fff;padding:30px 20px;display:flex;flex-direction:column}.brand{font-size:22px;font-weight:750;letter-spacing:-.7px}.brand span{color:#91aeff}.brand small{display:block;font-size:12px;letter-spacing:2px;color:#a2b0cf;margin:5px 0 42px}nav button{display:block;width:100%;text-align:left;border:0;background:none;color:#b9c5df;padding:13px 15px;border-radius:9px;margin-bottom:6px}nav button.active{background:#2b416e;color:white}aside footer{margin-top:auto;font-size:14px;color:#adbcda}main{margin-left:236px;padding:28px 40px;max-width:1700px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e0e5ee;padding-bottom:22px}.crumb{color:#69748b;font-size:14px}.avatar{background:#e3eaff;color:#28469a;border-radius:50%;padding:9px;font-size:14px;font-weight:700}.notice{margin:22px 0;background:#edf2ff;border:1px solid #d5e0ff;padding:12px 17px;border-radius:8px;font-size:14px;color:#3d5281}.head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:26px 0}h1{font-size:30px;letter-spacing:-1px;margin:0}h2{font-size:19px;margin:0 0 14px}p{margin:7px 0;color:#657189}.btn{border:1px solid #d7deea;background:white;color:#243452;border-radius:7px;padding:10px 16px;font-weight:600;font-size:14px}.primary{background:#2759df;color:white;border-color:#2759df}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:20px 0 28px}.stat,.panel{background:white;border:1px solid #e0e6ef;border-radius:12px;padding:22px}.stat small{color:#69748b;font-size:14px}.stat strong{display:block;font-size:32px;margin:8px 0}.stat span{color:#68768f;font-size:13px}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}.toolbar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}input,select,textarea{border:1px solid #ccd5e4;border-radius:7px;padding:10px;background:white;color:#172340}input[type=search]{min-width:260px}table{width:100%;border-collapse:collapse;text-align:left;font-size:14px}th{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:#718099;background:#f8faff}td,th{padding:16px 12px;border-bottom:1px solid #ecf0f5}td strong{display:block}td small{color:#758198}.tablewrap{overflow:auto}.pill{display:inline-block;padding:4px 9px;border-radius:5px;background:#edf2ff;color:#38589b;font-size:12px}.green{background:#e7f5ef;color:#227254}.amber{background:#fff3de;color:#906c22}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0;border-bottom:1px solid #e8edf5}.muted{font-size:14px;color:#728098}.bar{height:7px;border-radius:4px;background:#edf1f8;margin-top:9px}.bar div{height:100%;background:#7496ee;border-radius:4px}.board{display:grid;grid-template-columns:repeat(4,minmax(190px,1fr));gap:15px;overflow:auto}.column{background:#eaf0f7;border-radius:10px;padding:15px}.card{background:white;border:1px solid #dfe5ef;padding:17px;border-radius:8px;margin:14px 0}.card select{width:100%;margin-top:14px;font-size:13px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;font-size:14px;font-weight:600;margin-bottom:14px}label input,label textarea,label select{display:block;width:100%;margin-top:7px;font-weight:400}textarea{min-height:200px;resize:vertical}dialog{border:0;border-radius:14px;padding:28px;width:min(560px,92vw);box-shadow:0 20px 80px #10204444}dialog::backdrop{background:#10204477}.toast{position:fixed;bottom:24px;right:24px;background:#102044;color:white;padding:14px 22px;border-radius:9px;max-width:450px}button:focus-visible,a:focus-visible{outline:3px solid #e7ab34;outline-offset:3px}@media(max-width:900px){aside{width:180px;padding:22px 12px}main{margin-left:180px;padding:20px}.grid,.formgrid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){aside{position:static;width:auto}.brand small{margin-bottom:15px}nav{display:flex;overflow:auto}nav button{width:auto;white-space:nowrap}aside footer{display:none}main{margin:0;padding:16px}.head{align-items:flex-start;flex-direction:column}.stats{gap:10px}.stat{padding:15px}.board{grid-template-columns:repeat(4,230px)}}
</style></head><body><aside><div class="brand">people<span>prime</span><small>OUTREACH WORKSPACE</small></div><nav id="nav"></nav><footer>People Prime America<br><br>Interface preview<br>Sample data · session only</footer></aside><main><div class="top"><span class="crumb">Workspace / <b id="crumb">Overview</b></span><span class="avatar">JA</span></div><div class="notice">Preview mode · Sample prospects and teammates. Changes reset on refresh. No emails are sent.</div><div id="app"></div></main><dialog id="modal"></dialog><div id="toast" class="toast" hidden></div><script>
const state={view:'Overview',query:'',owner:'All owners',campaign:'Draft',subject:'Extra recruiting support for {{company}}',body:'Hi {{firstName}},\n\nI’m reaching out from People Prime America. We support companies with software engineering, QA, and technical program hiring.\n\nDoes {{company}} work with external staffing partners? If so, I’d appreciate being connected with the person who manages vendor onboarding.\n\nBest,\nJahnavi\nPeople Prime America\n\n[Business mailing address required before sending]\nTo opt out, reply “unsubscribe”.',prospects:[{id:1,company:'Northstar Health',name:'Avery Morgan',email:'avery@northstar.example',role:'Talent Acquisition Lead',industry:'Healthcare technology',owner:'Jahnavi',stage:'New',signal:'Sample: engineering hiring',suppressed:false},{id:2,company:'Cobalt Systems',name:'Jordan Lee',email:'jordan@cobalt.example',role:'Vendor Manager',industry:'Enterprise software',owner:'Teammate',stage:'Contacted',signal:'Sample: vendor expansion',suppressed:false},{id:3,company:'Atlas Commerce',name:'Taylor Chen',email:'taylor@atlas.example',role:'Director of Talent',industry:'E-commerce',owner:'Jahnavi',stage:'Meeting',signal:'Sample: QA openings',suppressed:false},{id:4,company:'Lumen Data',name:'Casey Patel',email:'casey@lumen.example',role:'Engineering Operations',industry:'AI & data',owner:'Teammate',stage:'Replied',signal:'Sample: data team growth',suppressed:false},{id:5,company:'Harbor Financial',name:'Riley Brooks',email:'riley@harbor.example',role:'Procurement Manager',industry:'Financial services',owner:'Jahnavi',stage:'New',signal:'Sample: platform modernization',suppressed:true}]};
const stages=['New','Contacted','Replied','Meeting'];const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,4500)}function go(v){state.view=v;render()}function head(t,d,b=''){return `<div class="head"><div><h1>${t}</h1><p>${d}</p></div>${b}</div>`}function badge(t){return `<span class="pill ${t==='Replied'?'green':t==='Meeting'?'amber':''}">${t}</span>`}function rows(ps){return ps.map(p=>`<tr><td><strong>${esc(p.company)}</strong><small>${esc(p.industry)}</small></td><td>${esc(p.name)}<br><small>${esc(p.role)}</small></td><td>${esc(p.owner)}</td><td>${p.suppressed?'<span class="pill amber">Opted out</span>':badge(p.stage)}</td><td><button class="btn" onclick="detail(${p.id})">Review</button></td></tr>`).join('')}function table(ps){return `<div class="tablewrap"><table><thead><tr><th>Company</th><th>Contact</th><th>Owner</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows(ps)||'<tr><td colspan="5">No prospects match these filters.</td></tr>'}</tbody></table></div>`}
function render(){const tabs=['Overview','Prospects','Campaigns','Replies','Pipeline','Team & Outlook'];$('#nav').innerHTML=tabs.map((v,i)=>`<button class="${v===state.view?'active':''}" onclick="go('${v}')">${['◫','◎','✉','☷','▥','⚙'][i]} &nbsp; ${v}</button>`).join('');$('#crumb').textContent=state.view;let h='';if(state.view==='Overview'){h=head('Your next client starts here.','Review your outreach and keep every opportunity moving.','<button class="btn primary" onclick="go(\'Campaigns\')">Review campaign</button>')+`<div class="stats"><div class="stat"><small>Sample prospects</small><strong>${state.prospects.length}</strong><span>Across both owners</span></div><div class="stat"><small>Needs review</small><strong>${state.campaign==='Draft'?1:0}</strong><span>Campaign awaiting approval</span></div><div class="stat"><small>Sample replies</small><strong>1</strong><span>Needs a personal response</span></div><div class="stat"><small>Connected mailboxes</small><strong>0 / 2</strong><span>Microsoft 365 setup required</span></div></div><div class="grid"><section class="panel"><h2>Priority prospects</h2>${table(state.prospects.slice(0,3))}</section><section class="panel"><h2>Before your first send</h2><div class="row"><span>Connect team mailboxes</span><button class="btn" onclick="go('Team & Outlook')">Set up</button></div><div class="row"><span>Review message and recipients</span><button class="btn" onclick="go('Campaigns')">Review</button></div><div class="row"><span>Confirm sender identity and opt-out</span><span class="pill amber">Required</span></div><p class="muted">Outreach remains blocked until live setup is complete.</p></section></div>`}
if(state.view==='Prospects'){let ps=state.prospects.filter(p=>(p.company+' '+p.name+' '+p.industry).toLowerCase().includes(state.query.toLowerCase())&&(state.owner==='All owners'||p.owner===state.owner));h=head('Prospects','One contact owner. One shared view.','<button class="btn primary" onclick="addForm()">Add sample prospect</button>')+`<section class="panel"><div class="toolbar"><input aria-label="Search prospects" type="search" placeholder="Search companies or contacts" value="${esc(state.query)}" onchange="state.query=this.value;render()"><select aria-label="Filter owner" onchange="state.owner=this.value;render()">${['All owners','Jahnavi','Teammate'].map(x=>`<option ${state.owner===x?'selected':''}>${x}</option>`).join('')}</select><span class="muted">${ps.length} prospects · Vendor acceptance unverified</span></div>${table(ps)}</section>`}
if(state.view==='Campaigns'){h=head('Campaign review','Approve the message before it enters a sending workflow.',badge(state.campaign))+`<div class="grid"><section class="panel"><h2>US technical staffing introduction</h2><label>Sender<select id="sender"><option>Jahnavi · Outlook not connected</option><option>Teammate · Outlook not connected</option></select></label><label>Subject<input id="subject" value="${esc(state.subject)}" oninput="state.subject=this.value;state.campaign='Draft'"></label><label>Message<textarea id="body" oninput="state.body=this.value;state.campaign='Draft'">${esc(state.body)}</textarea></label><button class="btn" onclick="previewEmail()">Preview personalization</button> <button class="btn primary" onclick="state.campaign='Approved in preview';render();toast('Approval recorded for this session. Sending is still blocked.')">Approve draft</button></section><section class="panel"><h2>Sequence</h2><div class="row"><div><b>Initial introduction</b><p class="muted">After approval and mailbox setup</p></div><span class="pill">Day 1</span></div><div class="row"><div><b>First follow-up</b><p class="muted">Brief reminder of recruiting support</p></div><span class="pill">+4 days</span></div><div class="row"><div><b>Final follow-up</b><p class="muted">Close the loop politely</p></div><span class="pill">+7 days</span></div><h2 style="margin-top:25px">Recipient review</h2><p>${state.prospects.filter(p=>!p.suppressed&&p.stage==='New').length} new sample prospects eligible for review.</p><p class="muted">Opt-outs excluded across all senders. Production must also stop follow-ups on replies and bounces.</p><button class="btn" onclick="go('Prospects')">Review recipients</button><div class="notice">Live sending unavailable. Microsoft authorization, shared storage, reply detection, and a sending scheduler are not connected.</div></section></div>`}
if(state.view==='Pipeline'){h=head('Client pipeline','Move sample opportunities as conversations develop.')+`<div class="board">${stages.map(s=>`<section class="column"><b>${s}</b> <span class="muted">${state.prospects.filter(p=>p.stage===s&&!p.suppressed).length}</span>${state.prospects.filter(p=>p.stage===s&&!p.suppressed).map(p=>`<div class="card"><b>${esc(p.company)}</b><p class="muted">${esc(p.name)} · ${esc(p.owner)}</p><select aria-label="Stage for ${esc(p.company)}" onchange="state.prospects.find(p=>p.id===${p.id}).stage=this.value;render()">${stages.map(x=>`<option ${x===s?'selected':''}>${x}</option>`).join('')}</select></div>`).join('')}</section>`).join('')}</div>`}
if(state.view==='Replies'){h=head('Replies','Sample conversation · no live mailbox access.')+`<div class="grid"><section class="panel"><h2>Lumen Data</h2><span class="pill green">Interested · sample</span><p class="muted">Casey Patel · Engineering Operations</p><div class="notice">“Thanks for reaching out. Could you share the technical roles you cover and your screening process?”</div><label>Your reply<textarea id="reply">Hi Casey,\n\nThanks for getting back to us. We support software engineering, QA, and technical program hiring. I’d be happy to discuss your requirements and our screening process.\n\nWould you have time for a short introduction?</textarea></label><button class="btn primary" onclick="toast('Draft reviewed in preview. No email was sent.')">Review reply draft</button></section><section class="panel"><h2>Conversation context</h2><div class="row"><span>Assigned owner</span><b>Teammate</b></div><div class="row"><span>Follow-ups</span><span class="pill amber">Stopped · sample</span></div><p>Replies should receive a personal review before the next message.</p></section></div>`}
if(state.view==='Team & Outlook'){h=head('Team & Outlook','Each teammate sends from their own work mailbox.')+`<section class="panel"><h2>Workspace members</h2>${['Jahnavi','Teammate'].map((x,i)=>`<div class="row"><div><b>${x}</b><p class="muted">${i?'Sample member · Sales':'Workspace owner · Admin'}</p></div><span class="pill">Not connected</span><button class="btn" onclick="setup()">Connection details</button></div>`).join('')}<p class="muted">Team membership and permissions are illustrative. This preview is private to its owner; inviting colleagues requires live authentication.</p></section><section class="panel" style="margin-top:20px"><h2>Microsoft 365 setup</h2><p>Live setup requires your organization’s Microsoft application registration, approved mailbox permissions, and secure sign-in for each member. Your administrator may need to approve access.</p><p>Passwords are never requested in this preview. No mailbox permissions have been granted.</p></section>`}$('#app').innerHTML=h}
function openModal(h){$('#modal').innerHTML=h+'<p><button class="btn" onclick="document.querySelector(\'#modal\').close()">Close</button></p>';$('#modal').showModal()}function setup(){openModal('<h2>Outlook is not connected yet</h2><p>Next, configure Microsoft sign-in and secure mailbox authorization, then add a shared database and sending service.</p><p>This button does not sign in or request access. No credentials are needed for the interface preview.</p>')}
function detail(id){let p=state.prospects.find(x=>x.id===id);openModal(`<h2>${esc(p.company)}</h2><p>${esc(p.name)} · ${esc(p.role)}</p><p>${esc(p.email)}</p><div class="notice">${esc(p.signal)}<br>Fictional data. Supplier acceptance has not been verified.</div><label>Account owner<select onchange="state.prospects.find(p=>p.id===${id}).owner=this.value;render()">${['Jahnavi','Teammate'].map(x=>`<option ${x===p.owner?'selected':''}>${x}</option>`).join('')}</select></label><button class="btn" onclick="state.prospects.find(p=>p.id===${id}).suppressed=true;document.querySelector('#modal').close();render();toast('Contact excluded from all preview campaigns.')">Mark opted out</button>`)}
function previewEmail(){let p=state.prospects.find(p=>!p.suppressed&&p.stage==='New');if(!p)return toast('No eligible new prospects.');let fill=t=>t.replaceAll('{{company}}',p.company).replaceAll('{{firstName}}',p.name.split(' ')[0]);openModal(`<h2>${esc(fill(state.subject))}</h2><p class="muted">Sample recipient: ${esc(p.email)}</p><p style="white-space:pre-wrap">${esc(fill(state.body))}</p>`)}
function addForm(){openModal(`<h2>Add a sample prospect</h2><p>For this preview, use fictional details only.</p><form id="add"><label>Company<input name="company" required maxlength="100"></label><label>Contact name<input name="name" required maxlength="100"></label><label>Sample email<input name="email" type="email" placeholder="name@company.example" required></label><button class="btn primary">Add prospect</button></form>`);$('#add').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),email=f.get('email').trim().toLowerCase();if(!email.endsWith('.example'))return toast('Use a fictional .example email address for this preview.');if(state.prospects.some(p=>p.email.toLowerCase()===email))return toast('This contact already exists. Duplicate prevented.');state.prospects.push({id:Date.now(),company:f.get('company').trim(),name:f.get('name').trim(),email,role:'Contact role to review',industry:'Not specified',owner:'Jahnavi',stage:'New',signal:'Manually added sample',suppressed:false});$('#modal').close();render();toast('Sample prospect added for this session.')}}
render();if(document.modelContext?.registerTool){document.modelContext.registerTool({name:'view_outreach_section',description:'Navigate the interface preview. Does not send email.',inputSchema:{type:'object',properties:{section:{type:'string',enum:['Overview','Prospects','Campaigns','Replies','Pipeline','Team & Outlook']}},required:['section'],additionalProperties:false},execute:({section})=>{if(!['Overview','Prospects','Campaigns','Replies','Pipeline','Team & Outlook'].includes(section))throw Error('Unknown section');go(section);return {section,mode:'preview'};}})}
</script></body></html>
