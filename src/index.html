<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>People Prime | Outreach</title>
<meta name="description" content="People Prime America startup prospect discovery and approval">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%231a1a1a'/%3E%3Ctext x='8' y='29' font-size='24' fill='%23e8c547'%3EP%3C/text%3E%3C/svg%3E">
<style>
:root{
  --ink:#1c1c1c;
  --muted:#6d6860;
  --paper:#f3eee6;
  --card:#fffcf8;
  --gold:#e8c547;
  --mustard:#d9a441;
  --coral:#e07a48;
  --line:#e4ddd2;
  --navy:#2b3844;
  --lime:var(--gold);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 Outfit,system-ui,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button,a,input,textarea,select{transition:background .18s,border-color .18s,color .18s,transform .18s}
button:disabled{opacity:.45;cursor:not-allowed}
a{color:#8a5a22;text-underline-offset:3px}
.site-bar{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:28px;padding:18px 36px;background:rgba(243,238,230,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{font-family:Fraunces,Georgia,serif;font-size:22px;font-weight:700;letter-spacing:-.4px;white-space:nowrap;flex-shrink:0}
.brand span{display:inline-block;background:var(--gold);color:var(--ink);padding:0 7px;margin-left:4px;border-radius:4px;transform:rotate(-2deg)}
.brand small{display:none}
#nav{display:flex;flex-wrap:nowrap;gap:4px;margin-left:auto;overflow-x:auto;min-width:0;flex:1;justify-content:flex-end}
#nav button{border:0;background:none;color:#5f5a53;padding:8px 11px;font-size:13px;font-weight:500;border-radius:999px;white-space:nowrap}
#nav button:hover{color:var(--ink);background:#fff}
#nav button.active{background:var(--ink);color:#fff}
.avatar{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--gold);font-size:12px;font-weight:700;flex-shrink:0}
main{max-width:1280px;margin:0 auto;padding:18px 36px 80px}
.notice{margin:8px 0 10px;color:var(--muted);font-size:13px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin:18px 0 28px}
.head h1{font-family:Fraunces,Georgia,serif;font-size:clamp(40px,6vw,72px);font-weight:700;letter-spacing:-1.8px;line-height:.95;margin:0;text-transform:uppercase}
.head h1 em{font-style:normal;background:var(--gold);padding:0 .18em;border-radius:6px;display:inline-block;transform:rotate(-1.5deg)}
.head p{margin:14px 0 0;max-width:520px;color:var(--muted)}
h2{font-family:Fraunces,Georgia,serif;font-size:22px;margin:0 0 14px}
p{margin:8px 0;color:var(--muted)}
.btn{border:1px solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;padding:10px 16px;font-weight:600;font-size:14px}
.btn:hover:not(:disabled){background:#fff8e6}
.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.primary:hover:not(:disabled){background:#333}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:8px 0 28px}
.stat,.panel,.card,.column,.job-card,.rail-card{background:var(--card);border:1px solid var(--line);border-radius:18px;min-width:0}
.stat,.panel{padding:22px}
.stat small{color:var(--muted);font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.stat strong{display:block;font-family:Fraunces,Georgia,serif;font-size:40px;line-height:1.1;margin:10px 0 6px;color:var(--ink)}
.stat span{color:var(--muted);font-size:13px}
.stat:first-child{background:var(--gold);border-color:var(--gold)}
.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
.toolbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
input,select,textarea{border:1px solid var(--line);border-radius:999px;padding:11px 14px;background:#fff;color:var(--ink);max-width:100%}
textarea{border-radius:14px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--gold);outline-offset:2px}
table{width:100%;border-collapse:collapse;text-align:left;font-size:14px}
th{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600}
td,th{padding:16px 10px;border-bottom:1px solid var(--line)}
td strong{display:block;font-size:15px;margin-bottom:4px;color:var(--ink)}
td small,.muted,.sources-summary{color:var(--muted)}
tbody tr:hover{background:#faf6ef}
.tablewrap{overflow:auto}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;background:#f3eee6;color:#5c564e;font-size:12px;font-weight:600;white-space:nowrap}
.green{background:#e7f3e4;color:#3d6b38}
.amber{background:#f8ead0;color:#8a6320}
.row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:16px 0;border-bottom:1px solid var(--line);font-size:14px}
.board{display:grid;grid-template-columns:repeat(4,minmax(190px,1fr));gap:16px;overflow:auto}
.column{padding:18px;background:#f7f1e8}
.column>h2{border-bottom:2px solid var(--gold);padding-bottom:12px}
.card{padding:16px;margin:12px 0}
.card select{width:100%;margin-top:12px;font-size:13px}
.formgrid,.review-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
label{display:block;font-size:14px;font-weight:600;margin-bottom:14px;color:var(--ink)}
label input,label textarea,label select{display:block;width:100%;margin-top:8px;font-weight:400}
textarea{min-height:220px;resize:vertical}
dialog{color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;width:min(560px,92vw);max-height:90vh;overflow:auto}
dialog::backdrop{background:#1c181299;backdrop-filter:blur(4px)}
.toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;padding:14px 20px;border-radius:14px;max-width:min(450px,90vw);z-index:5}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.empty{padding:40px 20px;text-align:center;border:1px dashed var(--line);border-radius:16px;margin-top:16px;background:#fff}
.empty h2{color:var(--ink)}
.error{background:#fae9e7;color:#8a3936;padding:14px;border-radius:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips span,.chip{background:#fff;border:1px solid var(--line);color:#514c46;padding:7px 12px;border-radius:999px;font-size:13px}
input[type=checkbox]{display:inline;width:auto;margin:0 8px 0 0;accent-color:var(--mustard)}
.job-evidence{background:#f7f1e8;border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.scope-note{max-width:680px}
#scope,#jobscope{min-width:220px}
.magazine{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:36px;align-items:start}
.jobs-toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px;color:var(--muted);font-size:13px}
.jobs-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.job-card{padding:0;overflow:hidden;background:transparent;border:0;display:flex;flex-direction:column}
.job-cover{height:168px;border-radius:18px;display:flex;align-items:flex-end;justify-content:flex-end;padding:16px;color:#fff;font-family:Fraunces,Georgia,serif;font-size:42px;font-weight:700;letter-spacing:-1px}
.job-cover.t0{background:linear-gradient(145deg,#2d3b48,#7ea0b0)}
.job-cover.t1{background:linear-gradient(145deg,#e07a48,#f3c39a)}
.job-cover.t2{background:linear-gradient(145deg,#d9a441,#f3e3a8)}
.job-cover.t3{background:linear-gradient(145deg,#4d6b4a,#b7d0a8)}
.job-cover.t4{background:linear-gradient(145deg,#1c1c1c,#8a8073)}
.job-card h2{font-size:20px;line-height:1.3;margin:12px 0 6px;text-transform:none;letter-spacing:-.3px}
.job-card h2 a{color:var(--ink);text-decoration:none}
.job-card h2 a:hover{text-decoration:underline}
.job-company{margin:12px 0 0;font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#8a5a22}
.job-meta{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 14px;font-size:13px;color:var(--muted)}
.job-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.job-actions a{text-decoration:none}
.rail-card{padding:22px;margin-bottom:18px}
.rail-card h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-family:Outfit,sans-serif;color:var(--muted);margin-bottom:14px}
.rail-search input{width:100%}
.cat-list{display:flex;flex-direction:column;gap:10px}
.cat-list button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;color:var(--ink);font-size:14px;text-align:left}
.cat-list button.active{font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cta-card{background:var(--coral);border-color:var(--coral);color:#fff;padding:28px 24px}
.cta-card h2,.cta-card p{color:#fff;text-transform:none;letter-spacing:-.4px;font-family:Fraunces,Georgia,serif;font-size:32px;line-height:1.1}
.cta-card p{font-size:14px;font-family:Outfit,sans-serif;opacity:.9;margin-top:12px}
.brand-card{background:var(--gold);border-color:var(--gold);min-height:180px;display:flex;flex-direction:column;justify-content:space-between}
.brand-card strong{font-family:Fraunces,Georgia,serif;font-size:42px;line-height:.9;letter-spacing:-1.4px}
.scan-status{padding:12px 16px;background:#fff;border-radius:12px}
.jobs-summary{display:none}
.site-foot{max-width:1280px;margin:0 auto 40px;padding:0 36px;color:var(--muted);font-size:13px}
@media(max-width:1100px){
  .magazine,.grid,.stats{grid-template-columns:1fr}
  .jobs-list{grid-template-columns:1fr 1fr}
}
@media(max-width:850px){
  .review-grid,.formgrid,.jobs-list{grid-template-columns:1fr}
  .site-bar,main,.site-foot{padding-left:16px;padding-right:16px}
  #nav{order:3;width:100%;overflow:auto;margin:0}
  .site-bar{flex-wrap:wrap}
  .head h1{font-size:40px}
  .board{grid-template-columns:repeat(4,220px)}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="site-bar">
  <div class="brand">people<span>prime</span></div>
  <nav id="nav"></nav>
  <span class="avatar">JA</span>
</header>
<main>
  <div class="notice">Global remote companies from We Work Remotely, Remote.io, and Himalayas · Apollo finds the contact · Apollo sends the sequence</div>
  <div id="app"><p>Loading your workspace…</p></div>
</main>
<footer class="site-foot">People Prime America · Private workspace · Approval required for outreach</footer>
<dialog id="modal"></dialog>
<div id="toast" class="toast" hidden></div>
<script src="/app.js"></script>
</body>
</html>
